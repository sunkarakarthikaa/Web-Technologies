<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./smart.css">
    <title>Bootstrap</title>

</head>
<body>
    <div class="container">
       <form class=" w-50 mx-auto mt-5 bg-warning p-5 " >
        <!-- brings at centre-->

        <div class="mb-3" >
            <label for="username" class="form-label" >Username:</label>
            <input type="text" class="form-control"  name="username" id="username">
        </div>

        <div class="mb-3" >
            <!-- mb-3 creates margin btw username and password-->
            <label for="password" class="form-label" >Password:</label>
            <input type="password" name="password" id="password" class="form-control">
        </div>

        <div class="mb-3 form-switch " >
            <label>Select Skills</label>
            <div class="mb-3" >
                <input type="checkbox" name="css" id="css" class="form-check-input" >
                <label for="css" class="form-check-label">Frontend</label>
            </div>
            <div class="mb-3" >
                <input type="checkbox" name="css" id="css" class="form-check-input" >
                <label for="css" class="form-check-label">Backend</label>
            </div>
        </div>

        <div class="mb-3" >
            <label for="state">Select State:</label>
            <select name="state" id="state" class="form-select" >
                <option value="ap">Andra pradesh</option>
                <option value="ts">Telangana</option>
            </select>
        </div>

        <div class="mb-3" >
            <label for="fb" class="form-label">Feedback</label>
            <textarea name="fb" id="fb" cols="30" rows="10" class="form-control"></textarea>
        </div>

        <button class="btn btn-outline-dark" >Submit</button>

        <div class="table-responsive">  
        <table class="my-5 table table-bordered text-center table-primary table-striped table-hover table-sm">
            <thead>
                <tr>
                    <th>SNO.</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Email</th>
                </tr>
            </thead>

                </tr>

                </tr>
                <tr>

                </tr>
                <tr>
                    <td>100</td>
                    <td>Ramu</td>
                    <td>30</td>
                    <td>1234qwe@gmail.com</td>
                </tr>
            </tbody>
        </table>
        </div>
       </form>
    </div>
</body>
</html>
